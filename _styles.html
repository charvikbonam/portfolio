<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f6f3ec;--bg-alt:#efeae0;--card:#fff;--text:#14120e;--muted:#6d6658;--line:#e3ddd0;--accent:#b07a12;--accent-soft:#f6e7c4;--shadow-sm:0 4px 14px rgba(20,18,14,.05);--shadow:0 20px 50px rgba(20,18,14,.08);--shadow-lg:0 30px 80px rgba(20,18,14,.12);--r:18px;--r-lg:24px}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:700;letter-spacing:-.02em;line-height:1.15}
img{max-width:100%;display:block}a{color:inherit}
.nav{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:1.2rem 3rem;background:rgba(246,243,236,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.55rem;text-decoration:none;font-family:'Fraunces',serif;font-weight:900;font-size:1.15rem;letter-spacing:-.02em}
.brand-mark{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(176,122,18,.15)}
.brand-light{font-weight:400;font-style:italic;color:var(--muted);margin-left:2px}
.nav-menu{display:flex;gap:2.4rem}
.nav-menu a{text-decoration:none;color:var(--muted);font-size:.9rem;font-weight:500;padding:6px 0;position:relative;transition:color .25s}
.nav-menu a:hover,.nav-menu a.active{color:var(--text)}
.nav-menu a.active::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);border-radius:2px}
.btn-pill{padding:.6rem 1.3rem;border-radius:999px;background:var(--text);color:var(--bg);text-decoration:none;font-size:.82rem;font-weight:600;transition:all .25s}
.btn-pill:hover{background:var(--accent);transform:translateY(-1px)}
.btn{display:inline-block;padding:.95rem 1.9rem;border-radius:999px;font-size:.92rem;font-weight:600;text-decoration:none;cursor:pointer;border:1.5px solid transparent;transition:all .28s;font-family:inherit}
.btn-dark{background:var(--text);color:var(--bg)}
.btn-dark:hover{background:var(--accent);transform:translateY(-2px);box-shadow:0 10px 30px rgba(176,122,18,.25)}
.btn-ghost{border-color:var(--text);color:var(--text);background:transparent}
.btn-ghost:hover{background:var(--text);color:var(--bg);transform:translateY(-2px)}
.btn.full{width:100%;text-align:center}
.btn-danger{background:#b3261e;color:#fff}
.eyebrow{font-size:.78rem;letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:1.4rem}
.lede{font-size:1.08rem;color:var(--muted);max-width:600px;margin:0 auto}
.page-head{max-width:800px;margin:0 auto;padding:6rem 2rem 3rem;text-align:center}
.page-head h1{font-size:clamp(2rem,4.5vw,3.6rem);margin-bottom:1.2rem}
.footer{border-top:1px solid var(--line);background:var(--bg-alt);padding:4rem 2rem 2rem;margin-top:4rem}
.footer-grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:3rem;padding-bottom:2.5rem;border-bottom:1px solid var(--line);text-align:left}
.footer-brand{font-family:'Fraunces',serif;font-weight:700;font-size:1.2rem;margin-bottom:.5rem}
.footer-tag{color:var(--muted);font-size:.9rem;line-height:1.6}
.footer h5{font-family:'Inter',sans-serif;font-size:.75rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:1rem;font-weight:600}
.footer a{display:block;color:var(--text);text-decoration:none;font-size:.9rem;padding:.35rem 0;transition:color .2s}
.footer a:hover{color:var(--accent)}
.copyright{max-width:1100px;margin:1.8rem auto 0;font-size:.82rem;color:var(--muted);text-align:center}
.flashes{max-width:900px;margin:1.5rem auto 0;padding:0 2rem}
.flash{padding:.9rem 1.2rem;border-radius:12px;margin-bottom:.7rem;font-size:.92rem;border:1px solid}
.flash.success{background:#e7f5ea;border-color:#bfe4c6;color:#1e7a3a}
.flash.error{background:#fdecea;border-color:#f5c6c2;color:#b3261e}
@media(max-width:960px){.footer-grid{grid-template-columns:1fr;gap:2rem;text-align:center}.footer a{text-align:center}}
@media(max-width:720px){.nav{padding:1rem 1.2rem;flex-wrap:wrap;gap:.8rem;justify-content:center}.nav-menu{gap:1.2rem;font-size:.85rem}.btn-pill{padding:.5rem 1rem;font-size:.78rem}.page-head{padding:3.5rem 1.2rem 2rem}}
</style>
